image: python:3.10

definitions:
  services:
    postgres:
      image: postgres:15
      environment:
        POSTGRES_DB: test_db
        POSTGRES_USER: test_user
        POSTGRES_PASSWORD: test_password
    redis:
      image: redis:7-alpine

pipelines:
  default:
    - step:
        name: "Install Dependencies & Security Scan"
        caches:
          - pip
          - node
        script:
          - pip install --upgrade pip
          - pip install -r requirements.txt
          - pip install safety
          - safety check --json --output safety-report.json || true

    - step:
        name: "Code Quality & Linting"
        script:
          - pip install black flake8 isort mypy
          - black --check --diff .
          - flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          - isort --check-only --diff .
          - mypy api/ --ignore-missing-imports

    - step:
        name: "Database Setup & Backend Tests"
        services:
          - postgres
        script:
          - pip install pytest pytest-asyncio pytest-cov httpx psycopg2-binary
          - pytest tests/ -v --cov=. --cov-report=xml --cov-report=html

    - step:
        name: "Frontend Build & Tests"
        script:
          - cd frontend
          - npm install
          - npm run build
          - npm test -- --watchAll=false --coverage --passWithNoTests || echo "No frontend tests found"
          - cd ..

    - step:
        name: "Integration Tests"
        services:
          - postgres
          - redis
        script:
          - pip install -r requirements.txt
          - export DATABASE_URL="postgresql://test_user:test_password@localhost:5432/test_db"
          - export REDIS_URL="redis://localhost:6379"
          - python -m pytest tests/integration/ -v || echo "No integration tests found"

    - step:
        name: "Performance & Load Tests"
        script:
          - pip install locust
          - locust -f tests/performance/locustfile.py --headless --users 10 --spawn-rate 2 --run-time 30s || echo "No performance tests found"

  pull-requests:
    '**':
      - step:
          name: "PR Validation"
          script:
            - pip install black flake8 bandit mypy pytest pytest-cov
            - black --check --diff .
            - flake8 . --max-line-length=88 --extend-ignore=E203,W503
            - bandit -r . -f json -o bandit-report.json || true
            - mypy . --ignore-missing-imports --no-strict-optional
            - pytest tests/ -v --cov=. --cov-report=xml --cov-report=html

  branches:
    develop:
      - step:
          name: "Deploy to Staging"
          deployment: staging
          script:
            - echo "Deploying to staging environment..."
            - echo "Staging deployment completed."

    main:
      - step:
          name: "Deploy to Production"
          deployment: production
          script:
            - pip install -r requirements.txt
            - python -m pytest tests/ --cov=. --cov-fail-under=80
            - echo "Deployment successful"

  custom:
    manual-deploy:
      - step:
          name: "Manual Deployment"
          script:
            - echo "Manual deployment triggered..."
            - echo "Manual deployment completed."
