image: python:3.10

definitions:
  services:
    postgres:
      image: postgres:13
      environment:
        POSTGRES_DB: postgres
        POSTGRES_USER: postgres.owngitwtjbpttymdfjia
        POSTGRES_PASSWORD: Boolmind2025@@
        POSTGRES_HOST: aws-0-eu-north-1.pooler.supabase.com
        POSTGRES_PORT: 6543

pipelines:
  default:
    - step:
        name: "Install Dependencies & Security Scan"
        caches:
          - pip
          - node
        script:
          # Install Python dependencies
          - echo "Installing Python dependencies..."
          - pip install --upgrade pip
          - pip install -r requirements.txt
          
          # Install Node.js dependencies
          - echo "Installing Node.js dependencies..."
          - curl -o- https://raw.githubusercontent.com/nvm-sh/nvm/v0.39.0/install.sh | bash
          - export NVM_DIR="$HOME/.nvm"
          - '[ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"'
          - nvm install 16
          - nvm use 16
          - cd frontend
          - npm install
          - cd ..
          
          # Security vulnerability scan
          - echo "Running security scan..."
          - pip install safety
          - safety check --json --output safety-report.json || true
          
          - echo "Dependencies installed successfully."

    - step:
        name: "Code Quality & Linting"
        script:
          # Python linting and formatting
          - echo "Running Python code quality checks..."
          - pip install black flake8 isort mypy
          - black --check --diff .
          - flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          - isort --check-only --diff .
          - mypy api/ --ignore-missing-imports
          
          # JavaScript/React linting
          - echo "Running JavaScript code quality checks..."
          - cd frontend
          - npm install eslint prettier
          - npx eslint src/ --ext .js,.jsx,.ts,.tsx
          - npx prettier --check src/
          - cd ..
          
          - echo "Code quality checks completed."

    - step:
        name: "Database Setup & Backend Tests"
        script:
          # Set up Supabase environment variables
          - export DATABASE_URL="postgresql://postgres.owngitwtjbpttymdfjia:Boolmind2025%40%40@aws-0-eu-north-1.pooler.supabase.com:6543/postgres"
          - export DB_HOST="aws-0-eu-north-1.pooler.supabase.com"
          - export DB_PORT="6543"
          - export DB_NAME="postgres"
          - export DB_USER="postgres.owngitwtjbpttymdfjia"
          - export DB_PASSWORD="Boolmind2025@@"
          
          # Install test dependencies
          - pip install pytest pytest-asyncio pytest-cov httpx
          
          # Test database connection
          - echo "Testing database connection..."
          - pip install psycopg2-binary
          - python -c "import psycopg2; conn = psycopg2.connect('postgresql://postgres.owngitwtjbpttymdfjia:Boolmind2025%40%40@aws-0-eu-north-1.pooler.supabase.com:6543/postgres'); print('Database connection successful')"
          
          # Run database migrations
          - echo "Running database migrations..."
          - cd api
          - alembic upgrade head
          - cd ..
          
          # Run backend tests
          - echo "Running backend tests..."
          - cd api
          - pytest tests/ -v --cov=. --cov-report=xml --cov-report=html
          - cd ..
          
          # Test API endpoints
          - echo "Testing API endpoints..."
          - python -m pytest api/tests/test_api.py -v
          
          - echo "Backend tests completed."

    - step:
        name: "Frontend Build & Tests"
        script:
          # Build React application
          - echo "Building React application..."
          - cd frontend
          - npm run build
          
          # Run frontend tests (if test files exist)
          - echo "Running frontend tests..."
          - npm test -- --watchAll=false --coverage --passWithNoTests || echo "No frontend tests found"
          
          # Check build output
          - ls -la build/
          - cd ..
          
          - echo "Frontend build completed."

    - step:
        name: "Integration Tests"
        script:
          # Set up Supabase environment variables
          - export DATABASE_URL="postgresql://postgres.owngitwtjbpttymdfjia:Boolmind2025%40%40@aws-0-eu-north-1.pooler.supabase.com:6543/postgres"
          - export DB_HOST="aws-0-eu-north-1.pooler.supabase.com"
          - export DB_PORT="6543"
          - export DB_NAME="postgres"
          - export DB_USER="postgres.owngitwtjbpttymdfjia"
          - export DB_PASSWORD="Boolmind2025@@"
          
          # Start backend server in background
          - echo "Starting backend server..."
          - cd api
          - python -m uvicorn main:app --host 0.0.0.0 --port 8000 &
          - sleep 10
          - cd ..
          
          # Run integration tests
          - echo "Running integration tests..."
          - python -m pytest tests/integration/ -v || echo "No integration tests found"
          
          # Test API with real requests
          - echo "Testing API endpoints with real requests..."
          - curl -f http://localhost:8000/health || echo "Health endpoint not found"
          
          - echo "Integration tests completed."

    - step:
        name: "Performance & Load Tests"
        script:
          # Install performance testing tools
          - pip install locust
          
          # Run basic performance tests
          - echo "Running performance tests..."
          - locust -f tests/performance/locustfile.py --headless --users 10 --spawn-rate 2 --run-time 30s || echo "No performance tests found"
          
          - echo "Performance tests completed."

  branches:
    develop:
      - step:
          name: "Deploy to Staging"
          deployment: staging
          script:
            - echo "Deploying to staging environment..."
            - echo "Staging deployment completed."
    
    main:
      - step:
          name: "Deploy to Production"
          deployment: production
          script:
            - echo "Deploying to production environment..."
            - echo "Production deployment completed."

  pull-requests:
    '**':
      - step:
          name: "PR Validation"
          script:
            - echo "Validating pull request..."
            - echo "PR validation completed."

  custom:
    manual-deploy:
      - step:
          name: "Manual Deployment"
          script:
            - echo "Manual deployment triggered..."
            - echo "Manual deployment completed."